name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared core
        run: npm run build -w @companion/core

      - name: Test shared core
        run: npm test

      - name: Build browser extension
        run: npm run build -w @companion/extension

      - name: Build desktop renderer
        run: npm run build:renderer -w @companion/desktop

      - name: Check Electron source syntax
        run: |
          node --check apps/desktop/src/main.js
          node --check apps/desktop/electron/main.mjs
